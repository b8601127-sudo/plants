<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="植物日誌">
<meta name="theme-color" content="#eef3f1">
<title>植物日誌</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef3f1;--card:#fff;--ink:#16302b;--sub:#6b807b;--line:#dde7e4;--acc:#2f7fd1;--accbg:#e3effb;--warn:#d9822b;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
:root[data-tab="fert"]{--acc:#6c8f1f;--accbg:#eaf1d6}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1816;--card:#18262a;--ink:#e6f0ee;--sub:#8ea5a0;--line:#26373a;--acc:#5aa6f0;--accbg:#173250;--warn:#f0a050;color-scheme:dark}
:root:not([data-theme="light"])[data-tab="fert"]{--acc:#a3c653;--accbg:#2a3516}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
html,body{height:100%;margin:0;overscroll-behavior:none}
body{position:fixed;inset:0;width:100%;touch-action:manipulation}
button,input{touch-action:manipulation}
body{background:var(--bg);color:var(--ink);font-family:"Noto Sans TC",system-ui,-apple-system,"PingFang TC","Microsoft JhengHei",sans-serif;display:flex;flex-direction:column;overflow:hidden}
header{padding:14px 18px 0}
h1{font-size:22px;margin:0;font-weight:700}
.hrow{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.syncb{border:1px solid var(--line);background:var(--card);color:var(--sub);border-radius:999px;padding:6px 12px;font-size:12px;font-weight:500;font-family:inherit;cursor:pointer;white-space:nowrap}
.syncb.ok{color:var(--acc);border-color:var(--acc)}
.syncb.bad{color:var(--warn);border-color:var(--warn)}
.sm{font-size:12px;color:var(--sub);line-height:1.6;margin:10px 0 0}
.err{font-size:13px;color:#d04a3a;margin:10px 0 0;min-height:1em}
.tabs{display:flex;position:relative;background:var(--card);border-radius:14px;padding:4px;border:1px solid var(--line)}
.tabs button{flex:1;border:0;background:none;color:var(--sub);font-size:15px;font-weight:500;font-family:inherit;padding:10px 0;z-index:1;cursor:pointer;transition:color .2s}
.tabs button.on{color:#fff}
.pill{position:absolute;top:4px;bottom:4px;left:4px;width:calc(50% - 4px);background:var(--acc);border-radius:11px;transition:transform .25s ease}
[data-tab="fert"] .pill{transform:translateX(100%)}
main{flex:1;min-height:0;display:flex;gap:0;padding:14px 0 0}
aside{width:118px;flex:none;overflow-y:auto;padding:0 8px 24px 14px;display:flex;flex-direction:column;gap:8px}
.tag{position:relative;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:14px;padding:8px 4px 7px;text-align:center;font-family:inherit;cursor:pointer;width:100%}
.tag.on{background:var(--accbg);border-color:var(--acc)}
.tag .th{width:60px;height:60px;border-radius:14px;font-size:30px;margin:0 auto 6px}
.tag b{display:block;font-size:13px;line-height:1.3;font-weight:500;white-space:normal;word-break:break-all}
.tag.on b{font-weight:700}
.tag .dot{position:absolute;top:6px;right:6px;width:9px;height:9px;border-radius:50%;background:var(--warn);border:2px solid var(--card)}
.tag{user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.tag.ghost{position:fixed;z-index:60;pointer-events:none;margin:0;box-shadow:0 10px 24px rgba(0,0,0,.3);transform:scale(1.05);opacity:.96}
.tag.src{opacity:.25}
.hint{font-size:11px;color:var(--sub);text-align:center;margin:2px 0 0;line-height:1.4}
.tag.new{border-style:dashed;color:var(--sub);background:none;font-size:13px;padding:12px 4px}
.tag.new span{display:block;font-size:22px;line-height:1.1}
.th{background:var(--accbg);display:grid;place-items:center;overflow:hidden}
.th svg{width:100%;height:100%;display:block}
.th img{width:100%;height:100%;object-fit:cover;display:block}
.detail{flex:1;min-width:0;overflow-y:auto;padding:0 18px 40px 6px}
.dh{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.dh .th{width:60px;height:60px;border-radius:16px;font-size:32px;flex:none}
.dh h2{margin:0;font-size:19px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dh p{margin:2px 0 0;font-size:13px;color:var(--acc);font-weight:500}
.dh p.late{color:var(--warn)}
.dh .ed{margin-left:auto;border:1px solid var(--line);background:none;color:var(--sub);border-radius:10px;padding:6px 9px;font-size:13px;font-family:inherit;cursor:pointer;flex:none}
.btns{display:flex;gap:8px;margin-bottom:14px}
.btns button{font-family:inherit;border-radius:12px;padding:11px 10px;font-size:14px;font-weight:500;cursor:pointer}
.main{flex:1;background:var(--acc);color:#fff;border:0}
.alt{background:none;border:1px solid var(--line);color:var(--sub)}
.sec{font-size:13px;color:var(--sub);margin:0 0 6px}
.rec{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 8px 10px 12px;margin-bottom:8px}
.rec .d{flex:1;min-width:0}
.rec .d b{display:block;font-size:15px}
.rec .d span{font-size:12px;color:var(--sub)}
.rec .ago{font-size:13px;color:var(--acc);font-weight:500;white-space:nowrap}
.rec button{border:0;background:none;color:var(--sub);font-size:18px;padding:0 6px;cursor:pointer}
.rec.first{border-color:var(--acc)}
.none{font-size:13px;color:var(--sub);padding:14px 0}
.empty{text-align:center;color:var(--sub);padding:48px 12px;line-height:1.7;font-size:14px}
.artgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(68px,1fr));gap:6px;padding:2px}
.ab{border:2px solid transparent;border-radius:12px;background:var(--bg);padding:3px;font-size:11px;font-family:inherit;color:var(--ink);text-align:center;cursor:pointer}
.ab.on{border-color:var(--acc)}
.ab .th{width:100%;aspect-ratio:1;border-radius:9px}
.ab .th.up{display:flex;flex-direction:column;gap:1px;font-size:22px;color:var(--sub);background:none;border:1px dashed var(--line)}
.ab .th small{font-size:11px;line-height:1}
.wheels{position:relative;display:flex;gap:6px;margin-top:4px}
.wheels::before{content:"";position:absolute;left:0;right:0;top:80px;height:40px;border-radius:12px;background:var(--accbg)}
.wh{position:relative;z-index:1;flex:1;height:200px;overflow-y:auto;scroll-snap-type:y mandatory;scrollbar-width:none;overscroll-behavior:contain;-webkit-mask-image:linear-gradient(transparent,#000 28%,#000 72%,transparent);mask-image:linear-gradient(transparent,#000 28%,#000 72%,transparent);user-select:none;-webkit-user-select:none}
.wh::-webkit-scrollbar{display:none}
.wi{height:40px;line-height:40px;text-align:center;transform-origin:50% 50%;backface-visibility:hidden;will-change:transform,opacity;scroll-snap-align:center;font-size:18px;color:var(--sub);cursor:pointer}
.wi.on{color:var(--ink);font-weight:700}
.sp{height:80px}
.rprev{text-align:center;margin-top:10px;font-size:15px;font-weight:500;color:var(--acc)}
.pic{display:flex;align-items:center;gap:10px;margin-top:10px}
.pic label{margin:0;padding:8px 12px;border:1px solid var(--line);border-radius:10px;color:var(--ink);cursor:pointer}
.pic .pv{width:44px;height:44px;border-radius:10px;object-fit:cover;background:var(--bg)}
.pic button{border:0;background:none;color:var(--sub);font-size:13px;font-family:inherit;cursor:pointer}
dialog{border:0;border-radius:20px;padding:0;width:min(94vw,400px);max-height:calc(100vh - 24px);max-height:calc(100dvh - 24px);max-height:calc(var(--vh,100dvh) - 24px);overflow:hidden;background:var(--card);color:var(--ink);font-family:inherit}
dialog[open]{display:flex;flex-direction:column}
.dbody{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:20px 20px 8px}
dialog::backdrop{background:rgba(0,0,0,.45)}
dialog h2{outline:none;margin:0 0 14px;font-size:18px}
label{display:block;font-size:13px;color:var(--sub);margin:12px 0 6px}
input{width:100%;font-size:16px;font-family:inherit;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.emo{display:flex;flex-wrap:wrap;gap:6px}
.emo button{font-size:24px;width:44px;height:44px;border-radius:12px;border:2px solid transparent;background:var(--bg);cursor:pointer}
.emo button.on{border-color:var(--acc)}
.row2{display:flex;gap:10px}
.row2>div{flex:1}
.dact{display:flex;gap:8px;flex:none;padding:12px 20px calc(14px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);background:var(--card)}
.dact button{flex:1;font-size:15px;font-weight:500;font-family:inherit;padding:11px;border-radius:12px;border:1px solid var(--line);background:none;color:var(--ink);cursor:pointer}
.dact .ok{background:var(--acc);border-color:var(--acc);color:#fff}
.dact .del{color:#d04a3a;flex:none;padding:11px 14px}
</style>
</head>
<body>
<header>
  <div class="hrow"><h1>植物日誌</h1><button class="syncb" id="syncBtn">雲端同步・未設定</button></div>
  <div class="tabs"><div class="pill"></div>
    <button class="on" data-t="water">澆水</button>
    <button data-t="fert">施肥</button>
  </div>
</header>
<main>
  <aside id="side"></aside>
  <section class="detail" id="detail"></section>
</main>

<dialog id="dp">
<div class="dbody">
  <h2 id="dpT" tabindex="-1" autofocus>新增植物</h2>
  <label>名稱</label><input id="fName" placeholder="例如：龜背芋" maxlength="20">
  <label>縮圖</label><div class="artgrid" id="fArt"></div><input type="file" id="fPic" accept="image/*" hidden>
  <div class="row2">
    <div><label>澆水週期（天）</label><input id="fW" type="number" min="1" max="90" value="7"></div>
    <div><label>施肥週期（月）</label><input id="fF" type="number" min="1" max="24" value="3"></div>
  </div>
</div>
  <div class="dact"><button class="del" id="fDel" hidden>刪除</button><button id="fNo">取消</button><button class="ok" id="fOk">儲存</button></div>
</dialog>

<dialog id="ds">
<div class="dbody">
  <h2 tabindex="-1" autofocus>雲端同步（GitHub）</h2>
  <label>GitHub 帳號名稱</label><input id="gOwner" placeholder="例如：yourname" autocapitalize="off" autocomplete="off">
  <label>私人資料 repo 名稱</label><input id="gRepo" placeholder="例如：plant-data" autocapitalize="off" autocomplete="off">
  <label>Token（github_pat_…）</label><input id="gTok" type="password" placeholder="貼上你產生的 token" autocomplete="off">
  <p class="sm">資料會存成 repo 裡的 plant-data.json。Token 只保存在這支裝置的瀏覽器中，每台裝置各設定一次。</p>
  <div class="err" id="gErr"></div>
</div>
  <div class="dact"><button class="del" id="gOff" hidden>中斷連線</button><button id="gNo">取消</button><button class="ok" id="gOk">儲存並同步</button></div>
</dialog>

<dialog id="dr">
<div class="dbody">
  <h2 id="drT" tabindex="-1" autofocus>補記時間</h2>
  <div class="wheels"><div class="wh" id="wY"></div><div class="wh" id="wM"></div><div class="wh" id="wD"></div></div>
  <div class="rprev" id="rPrev"></div>
</div>
  <div class="dact"><button id="rNo">取消</button><button class="ok" id="rOk">記錄</button></div>
</dialog>

<script>
(function(){
var KEY="plantcare.v2", DAY=864e5, EMOJIS=["🪴","🌸","🌻","🌷","🌹","🌺","🍅","🍓","🍋","🥕","🌶️","🍄","🌾","🍀","🍁","🌴"];
var pick="art", art="", tab="water", sel=null, plants=[], editId=null, photo="", emo=EMOJIS[0], recTarget=null, delArm=false;
var root=document.documentElement;


/* 手繪植物插圖 */

function lf(x,y,l,w,a,f,o){o=o||{};
  var d='C'+w+' '+(-l*.3)+' '+w+' '+(-l*.7)+' 0 '+(-l);
  var g='<g transform="translate('+x+' '+y+') rotate('+a+')"><path d="M0 0'+d+'C'+(-w)+' '+(-l*.7)+' '+(-w)+' '+(-l*.3)+' 0 0Z" fill="'+f+'" stroke="'+(o.s||'rgba(0,0,0,.22)')+'" stroke-width=".6"/><path d="M0 0'+d+'Z" fill="#fff" opacity=".13"/>';
  if(o.v)g+='<path d="M0 -1L0 '+(-l*.92)+'" stroke="'+o.v+'" stroke-width=".9" fill="none"/>';
  if(o.b)for(var t=.2;t<.9;t+=.16){var hw=w*.8*Math.sin(Math.PI*t);g+='<path d="M'+(-hw)+' '+(-l*t)+'L'+hw+' '+(-l*t)+'" stroke="'+o.b+'" stroke-width="1.1" opacity=".85"/>'}
  return g+'</g>'}
function heart(x,y,sz,a,f,o){o=o||{};var g='<g transform="translate('+x+' '+y+') rotate('+a+') scale('+(sz/20)+')"><path d="M0 0C-11 -5 -13 -17 -6 -19C-2.5 -20 0 -17 0 -14.5C0 -17 2.5 -20 6 -19C13 -17 11 -5 0 0Z" fill="'+f+'" stroke="rgba(0,0,0,.25)" stroke-width=".8"/>';

  for(var i=1;i<=n;i++){var t=i/n*.95+.05,m=1-t,

function pot(c,r,w){w=w||36;var x=50-w/2;
  return '<path d="M'+x+' 73L'+(x+w)+' 73L'+(x+w-4)+' 95Q50 98 '+(x+4)+' 95Z" fill="'+c+'"/><path d="M'+(x+w*.62)+' 73L'+(x+w)+' 73L'+(x+w-4)+' 95Q'+(50+w*.2)+' 97 '+(50+w*.12)+' 95.5Z" fill="#000" opacity=".12"/><rect x="'+(x-3)+'" y="69" width="'+(w+6)+'" height="7" rx="2" fill="'+r+'"/>'}
var BG='<defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f4f0e8"/><stop offset="1" stop-color="#d8d1c3"/></linearGradient></defs><rect width="100" height="100" fill="url(#bg)"/><rect y="95" width="100" height="5" fill="#b49f80"/>';
function vine(list,f,o,pc,pr){
  var h='';list.forEach(function(q){h+='<path d="M50 72Q'+((50+q[0])/2)+' '+(q[1]+(q[3]>90?-10:12))+' '+q[0]+' '+q[1]+'" stroke="#4d7a3a" stroke-width="1" fill="none"/>'});
  list.forEach(function(q){h+=heart(q[0],q[1],q[2],q[3],f,o)});
  return h+pot(pc,pr)}
function tri(x,y,s,a){return '<g transform="translate('+x+' '+y+') rotate('+a+') scale('+s+')"><path d="M0 0L-7 -12Q0 -17 7 -12Z" fill="#f4eec4" stroke="rgba(0,0,0,.22)" stroke-width=".7"/><path d="M0 -2L-4 -10Q0 -13 4 -10Z" fill="#6aa84f"/></g>'}
var ART={
 haworthia:function(){var h='',i,a;for(i=0;i<14;i++){a=-72+i*11;h+=lf(50,73,27-Math.abs(a)*.12,5.5,a,'#2d5a37',{b:'#e6efe3'})}
   for(i=0;i<9;i++){a=-48+i*12;h+=lf(50,74,21,5,a,'#3d7242',{b:'#eef4ea'})}return h+pot('#eeeae2','#fff',30)},
 generic:function(){var h='',A=[-62,-40,-20,0,20,40,62],i;for(i=0;i<7;i++)h+=lf(50,72,36-Math.abs(A[i])*.25,10,A[i],'#4f8f4a',{v:'#a8d28d'});return h+pot('#c4714a','#d4835b')},
 fern:function(){var h='',E=[[22,56,12,66],[20,46,16,36],[38,38,32,20],[50,38,50,16],[62,38,68,20],[80,46,84,36],[78,56,88,66]];E.forEach(function(e){h+=frond(50,72,e[0],e[1],e[2],e[3],'#4f9a3c',11,9)});return h+pot('#d9d2c5','#e9e3d8')},
 pothos:function(){return vine([[50,34,17,0],[36,44,16,-32],[64,42,16,30],[27,58,14,-62],[74,56,14,64],[22,76,13,200],[78,78,13,160],[16,90,11,185]],'#7db541',{pt:'#f0e169'},'#c4714a','#d4835b')},
 spider:function(){var h='',D=[-34,-27,-20,-12,-4,5,13,21,28,35],i,dx,hh;for(i=0;i<D.length;i++){dx=D[i];hh=30+rnd(i)*12;var p='M50 72Q'+(50+dx*.45)+' '+(72-hh)+' '+(50+dx*1.1)+' '+(68+Math.abs(dx)*.6);
   h+='<path d="'+p+'" stroke="#5f9f40" stroke-width="3.6" fill="none" stroke-linecap="round"/><path d="'+p+'" stroke="#eef5dc" stroke-width="1.2" fill="none" stroke-linecap="round"/>'}return h+pot('#d9d2c5','#e9e3d8')},
 scindapsus:function(){return vine([[50,36,16,0],[34,46,15,-35],[66,44,15,35],[24,62,14,-70],[76,60,14,70],[20,82,13,195],[80,80,13,165],[34,90,11,200]],'#2f6b4a',{sp:'#d4e6da',v:'rgba(210,230,215,.5)'},'#8a8f94','#a2a7ac')},
 peace:function(){var h='',A=[-52,-36,-20,-6,8,22,38,54],i;for(i=0;i<8;i++)h+=lf(50,72,38+rnd(i)*8,9.5,A[i],'#245f36',{v:'#7fb283'});
   h+='<path d="M50 72Q47 58 44 46" stroke="#3c7a45" stroke-width="1.4" fill="none"/><path d="M52 72Q57 58 61 42" stroke="#3c7a45" stroke-width="1.4" fill="none"/>'+lf(44,48,24,6.2,-6,'#f8f6ef',{s:'#d6d3c4'})+lf(61,44,20,5.4,8,'#f8f6ef',{s:'#d6d3c4'})+'<ellipse cx="44" cy="43" rx="1.4" ry="4" fill="#e6d680"/>';return h+pot('#777c80','#8f9498')},
 fiddle:function(){var h='<path d="M50 74Q48 50 48 26" stroke="#6b5036" stroke-width="3" fill="none" stroke-linecap="round"/>',y,s=1;for(y=62;y>=32;y-=7){h+=lf(49,y,22,11,s*(58-(62-y)*.5),'#3f7d34',{v:'#b5d69a'});s=-s}return h+lf(48,28,22,10,0,'#3f7d34',{v:'#b5d69a'})+pot('#cdb89a','#dbc9ad')},
 triangle:function(){var h='',i,a,r,pts=[];for(i=0;i<18;i++){a=-68+i*8;r=16+rnd(i+3)*22;pts.push([50+Math.sin(a*Math.PI/180)*r,70-Math.cos(a*Math.PI/180)*r,a])}
   pts.forEach(function(q){h+='<path d="M50 72L'+q[0]+' '+q[1]+'" stroke="#7a6a50" stroke-width=".9"/>'});
   pts.forEach(function(q,i){h+=tri(q[0],q[1],.85+rnd(i)*.4,q[2]+(rnd(i+9)-.5)*70)});return h+pot('#c4714a','#d4835b')},

function pad(x){return x<10?"0"+x:""+x}
function fmt(t){var d=new Date(t),w="日一二三四五六"[d.getDay()];return (d.getMonth()+1)+"/"+d.getDate()+" 週"+w+" "+pad(d.getHours())+":"+pad(d.getMinutes())}
function ago(t){
  var a=new Date(t), b=new Date(); a.setHours(0,0,0,0); b.setHours(0,0,0,0);
  var n=Math.round((b-a)/DAY); return n<=0?"今天":n===1?"昨天":n+" 天前";
}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}

function thumb(p){return '<div class="th">'+(p.photo?'<img src="'+p.photo+'" alt="">':(p.art&&ART[p.art])?artSvg(p.art):emojiSvg(p.emoji))+'</div>'}
function day0(t){var d=new Date(t);d.setHours(0,0,0,0);return d}
function info(p,k){
  var list=(p[k]||[]).slice().sort(function(a,b){return b-a}), last=list[0];
  var verb=k==="water"?"澆水":"施肥", st="尚無"+verb+"紀錄", late=false;
  if(last){
    var due=day0(last);
    if(k==="water")due.setDate(due.getDate()+p.wEvery); else due.setMonth(due.getMonth()+(p.fMonths||3));
    var left=Math.round((due-day0(Date.now()))/DAY), ds=(due.getMonth()+1)+"/"+due.getDate();
    if(left>0)st="下次"+verb+" "+ds+"（還有 "+left+" 天）";
    else if(left===0)st="今天該"+verb+"了";
    else{st="應於 "+ds+" "+verb+"，已逾期 "+(-left)+" 天";late=true}
  }
  return {list:list,st:st,late:late,verb:verb};
}
function render(){
  root.setAttribute("data-tab",tab);
  document.querySelectorAll(".tabs button").forEach(function(b){b.classList.toggle("on",b.dataset.t===tab)});
  if(!plants.some(function(x){return x.id===sel}))sel=plants[0]?plants[0].id:null;
  var side=document.getElementById("side"), det=document.getElementById("detail");
  side.innerHTML=plants.map(function(p){
    return '<button class="tag'+(p.id===sel?" on":"")+'" data-sel="'+p.id+'">'+(info(p,tab).late?'<i class="dot"></i>':'')+thumb(p)+'<b>'+esc(p.name)+'</b></button>';
  }).join("")+'<button class="tag new" data-new="1"><span>＋</span>新增</button><p class="hint">長按後上下拖曳排序</p>';
  var p=plants.find(function(x){return x.id===sel});
  if(!p){det.innerHTML='<div class="empty">還沒有植物<br>點左側的「＋ 新增」</div>';return}
  var i=info(p,tab);
  var h='<div class="dh">'+thumb(p)+'<div style="min-width:0"><h2>'+esc(p.name)+'</h2><p class="'+(i.late?"late":"")+'">'+i.st+'</p></div><button class="ed" data-edit="'+p.id+'">編輯</button></div>'+
    '<div class="btns"><button class="main" data-now="'+p.id+'">已'+i.verb+'</button><button class="alt" data-late="'+p.id+'">補記</button></div>'+
    '<p class="sec">最近 5 次'+i.verb+'</p>';
  h+=i.list.length?i.list.slice(0,5).map(function(t,n){
    var d=new Date(t);
    return '<div class="rec'+(n?"":" first")+'"><div class="d"><b>'+(d.getMonth()+1)+'/'+d.getDate()+' 週'+"日一二三四五六"[d.getDay()]+'</b></div><span class="ago">'+ago(t)+'</span><button data-del="'+p.id+'|'+t+'" aria-label="刪除這筆紀錄">×</button></div>';
  }).join(""):'<div class="none">還沒有紀錄，按上方按鈕開始記錄。</div>';
  det.innerHTML=h;
}

/* 記錄 */
function addRec(id,k,t){
  var p=plants.find(function(x){return x.id===id}); if(!p)return;
  p[k].push(t); save(); render();
}
document.addEventListener("click",function(e){
  if(Date.now()-justDragged<400)return;
  var el=e.target.closest("[data-sel],[data-new],[data-now],[data-late],[data-del],[data-edit]"); if(!el)return;
  var d=el.dataset;
  if(d.sel){sel=+d.sel;render();document.getElementById("detail").scrollTop=0}
  else if(d.new)openPlant(null);
  else if(d.now)addRec(+d.now,tab,Date.now());
  else if(d.late){
    recTarget=+d.late;
    document.getElementById("drT").textContent=tab==="water"?"補記澆水日期":"補記施肥日期";
    document.getElementById("dr").showModal(); wInit();
  }else if(d.del){
    var a=d.del.split("|"), p=plants.find(function(x){return x.id===+a[0]});
    p[tab]=p[tab].filter(function(t){return String(t)!==a[1]}); save(); render();
  }else if(d.edit)openPlant(+d.edit);
});
document.getElementById("rNo").onclick=function(){document.getElementById("dr").close()};
document.getElementById("rOk").onclick=function(){
  var w=wState(), t=new Date(w.y,w.m-1,w.d,12).getTime();
  if(!isNaN(t))addRec(recTarget,tab,Math.min(t,Date.now()));
  document.getElementById("dr").close();
};

/* 植物表單 */
function drawArt(){
  var h='<button type="button" class="ab" data-up="1" aria-label="上傳照片"><div class="th up"><span>📷</span><small>上傳</small></div></button>';
  if(photo)h+='<button type="button" class="ab'+(pick==="photo"?" on":"")+'" data-p="1" aria-label="我的照片"><div class="th"><img src="'+photo+'" alt=""></div></button>';
  h+=ARTORDER.map(function(k){return '<button type="button" class="ab'+(pick==="art"&&k===art?" on":"")+'" data-a="'+k+'" aria-label="'+ARTNAME[k]+'" title="'+ARTNAME[k]+'"><div class="th">'+artSvg(k)+'</div></button>'}).join("");
  h+=EMOJIS.map(function(x){return '<button type="button" class="ab'+(pick==="emo"&&x===emo?" on":"")+'" data-e="'+x+'"><div class="th">'+emojiSvg(x)+'</div></button>'}).join("");
  document.getElementById("fArt").innerHTML=h;
}
document.getElementById("fArt").onclick=function(e){
  var b=e.target.closest("button[data-up],button[data-p],button[data-a],button[data-e]"); if(!b)return;
  var d=b.dataset;
  if(d.up){document.getElementById("fPic").click();return}
  if(d.p)pick="photo"; else if(d.a){pick="art";art=d.a} else{pick="emo";emo=d.e}
  drawArt();
};
function openPlant(id){
  editId=id||null; delArm=false;
  var p=plants.find(function(x){return x.id===id});
  document.getElementById("dpT").textContent=p?"編輯植物":"新增植物";
  document.getElementById("fName").value=p?p.name:"";
  document.getElementById("fW").value=p?p.wEvery:7;
  document.getElementById("fF").value=p?(p.fMonths||3):3;
  emo=p?p.emoji:EMOJIS[0]; art=p?(p.art||""):"monstera"; photo=p&&p.photo||""; pick=p?(p.photo?"photo":(p.art?"art":"emo")):"art"; drawArt();
  var del=document.getElementById("fDel"); del.hidden=!p; del.textContent="刪除";
  document.getElementById("dp").showModal();
}
document.getElementById("fPic").onchange=function(){
  var f=this.files[0]; this.value=""; if(!f)return;
  var img=new Image(), u=URL.createObjectURL(f);
  img.onload=function(){
    var S=200, c=document.createElement("canvas"), m=Math.min(img.width,img.height);
    c.width=c.height=S;
    c.getContext("2d").drawImage(img,(img.width-m)/2,(img.height-m)/2,m,m,0,0,S,S);
    photo=c.toDataURL("image/jpeg",0.8); URL.revokeObjectURL(u); pick="photo"; drawArt();
  };
  img.src=u;
};
document.getElementById("fNo").onclick=function(){document.getElementById("dp").close()};
document.getElementById("fDel").onclick=function(){
  if(!delArm){delArm=true;this.textContent="再按一次確認";return}
  plants=plants.filter(function(x){return x.id!==editId}); save(); render(); document.getElementById("dp").close();
};
document.getElementById("fOk").onclick=function(){
  var name=document.getElementById("fName").value.trim();
  if(!name){document.getElementById("fName").focus();return}
  var w=Math.max(1,+document.getElementById("fW").value||7), f=Math.max(1,+document.getElementById("fF").value||3);
  if(editId){var p=plants.find(function(x){return x.id===editId});p.name=name;p.art=pick==="art"?art:"";p.emoji=emo;p.photo=pick==="photo"?photo:"";p.wEvery=w;p.fMonths=f}
  else plants.push({id:(sel=Date.now()),name:name,emoji:emo,art:pick==="art"?art:"",photo:pick==="photo"?photo:"",wEvery:w,fMonths:f,water:[],fert:[]});
  save(); render(); document.getElementById("dp").close();
};

/* 補記日期：拉霸式滾輪 */
var RW=40, WK="日一二三四五六", cy=new Date().getFullYear();
function $(id){return document.getElementById(id)}
function wFill(id,labels,idx){
  var el=$(id); el._n=labels.length; el._i=-1;
  el.innerHTML='<div class="sp"></div>'+labels.map(function(t){return '<div class="wi">'+t+'</div>'}).join("")+'<div class="sp"></div>';
  el.scrollTop=idx*RW; wMark(el,idx); wFx(el);
}
function wMark(el,i){if(el._i===i)return;if(el._i>=0)try{navigator.vibrate&&navigator.vibrate(5)}catch(x){}el._i=i;for(var k=1;k<=el._n;k++)el.children[k].classList.toggle("on",k-1===i)}
function wIdx(el){return Math.max(0,Math.min(el._n-1,Math.round(el.scrollTop/RW)))}
function wFx(el){
  var st=el.scrollTop, c=el.children;
  for(var k=1;k<=el._n;k++){
    var r=Math.max(-2.6,Math.min(2.6,((k-1)*RW-st)/RW)), a=Math.abs(r), it=c[k];
    it.style.transform="perspective(260px) rotateX("+(-r*26)+"deg) scale("+(1-a*.07)+")";
    it.style.opacity=Math.max(.12,1-a*.3)*(it.classList.contains("x")?.3:1);
  }
}
function wDays(n){var a=[];for(var i=1;i<=n;i++)a.push(i+"日");return a}
function wState(){return {y:cy-2+wIdx($("wY")),m:wIdx($("wM"))+1,d:wIdx($("wD"))+1}}
function wInit(){
  var n=new Date();
  wFill("wY",[cy-2,cy-1,cy].map(function(y){return y+"年"}),2);
  var ms=[];for(var i=1;i<=12;i++)ms.push(i+"月");
  wFill("wM",ms,n.getMonth());
  wFill("wD",wDays(new Date(cy,n.getMonth()+1,0).getDate()),n.getDate()-1);
  wSettle();
}
function wSettle(){
  var n=new Date(), ty=n.getFullYear(), tm=n.getMonth()+1, td=n.getDate(), s=wState(), ed=$("wD"), dim=new Date(s.y,s.m,0).getDate();
  if(ed._n!==dim){wFill("wD",wDays(dim),Math.min(wIdx(ed),dim-1));s=wState()}
  if(new Date(s.y,s.m-1,s.d)>new Date(ty,tm-1,td)){
    $("wY").scrollTo({top:2*RW,behavior:"smooth"}); $("wM").scrollTo({top:(tm-1)*RW,behavior:"smooth"});
    wFill("wD",wDays(new Date(ty,tm,0).getDate()),td-1); s={y:ty,m:tm,d:td};
  }
  var cm=$("wM").children, cd=$("wD").children;
  for(var i=1;i<=12;i++)cm[i].classList.toggle("x",s.y===ty&&i>tm);
  for(var j=1;j<=ed._n;j++)cd[j].classList.toggle("x",s.y===ty&&s.m===tm&&j>td);
  ["wY","wM","wD"].forEach(function(id){wFx($(id))});
  $("rPrev").textContent=s.y+"/"+s.m+"/"+s.d+"　週"+WK[new Date(s.y,s.m-1,s.d).getDay()];
}
["wY","wM","wD"].forEach(function(id){
  var el=$(id), tmr=0, drag=null;
  el.addEventListener("scroll",function(){wMark(el,wIdx(el));if(!el._raf)el._raf=requestAnimationFrame(function(){el._raf=0;wFx(el)});clearTimeout(tmr);tmr=setTimeout(wSettle,110)});
  el.addEventListener("click",function(e){
    var it=e.target.closest(".wi"); if(!it||el._moved)return;
    el.scrollTo({top:([].indexOf.call(el.children,it)-1)*RW,behavior:"smooth"});
  });
  el.addEventListener("pointerdown",function(e){
    if(e.pointerType!=="mouse")return;
    drag={y:e.clientY,t:el.scrollTop,lt:performance.now(),ls:el.scrollTop,v:0}; el._moved=false; el.style.scrollSnapType="none"; el.setPointerCapture(e.pointerId);
  });
  el.addEventListener("pointermove",function(e){
    if(!drag)return; var dy=e.clientY-drag.y; if(Math.abs(dy)>3)el._moved=true; el.scrollTop=drag.t-dy; var now=performance.now(), dt=now-drag.lt; if(dt>0){drag.v=(el.scrollTop-drag.ls)/dt*.6+drag.v*.4;drag.lt=now;drag.ls=el.scrollTop}
  });
  function glide(v){
    var last=performance.now(), max=(el._n-1)*RW;
    (function step(now){
      var dt=Math.min(32,now-last); last=now; el.scrollTop+=v*dt; v*=Math.pow(.94,dt/16);
      if(el.scrollTop<=0||el.scrollTop>=max)v=0;
      if(Math.abs(v)>.04)requestAnimationFrame(step);
      else{el.style.scrollSnapType="";el.scrollTo({top:wIdx(el)*RW,behavior:"smooth"})}
    })(last);
  }
  function up(){
    if(!drag)return; var v=drag.v, stale=performance.now()-drag.lt>90; drag=null; setTimeout(function(){el._moved=false},50);
    if(stale||Math.abs(v)<.05){el.style.scrollSnapType="";el.scrollTo({top:wIdx(el)*RW,behavior:"smooth"})} else glide(v);
  }
  el.addEventListener("pointerup",up); el.addEventListener("pointercancel",up);
});

/* 左欄拖曳排序 */
var side=document.getElementById("side"), DR=null, justDragged=0;
side.addEventListener("pointerdown",function(e){
  var tag=e.target.closest(".tag[data-sel]"); if(!tag||(e.pointerType==="mouse"&&e.button!==0))return;
  DR={tag:tag,x:e.clientX,y:e.clientY,on:false,touch:e.pointerType!=="mouse"};
  if(DR.touch)DR.timer=setTimeout(function(){if(DR&&!DR.on)startDrag()},350);
});
function startDrag(){
  var t=DR.tag, r=t.getBoundingClientRect(); DR.on=true; DR.off=DR.y-r.top;
  var g=t.cloneNode(true); g.className+=" ghost"; g.style.cssText="left:"+r.left+"px;top:"+r.top+"px;width:"+r.width+"px";
  document.body.appendChild(g); DR.ghost=g; t.classList.add("src");
  try{navigator.vibrate&&navigator.vibrate(12)}catch(x){}
}
function moveDrag(y){
  DR.ghost.style.top=(y-DR.off)+"px";
  var ar=side.getBoundingClientRect();
  if(y<ar.top+36)side.scrollTop-=10; else if(y>ar.bottom-36)side.scrollTop+=10;
  var tags=[].slice.call(side.querySelectorAll(".tag[data-sel]")).filter(function(t){return t!==DR.tag}), before=null;
  for(var i=0;i<tags.length;i++){var r=tags[i].getBoundingClientRect(); if(y<r.top+r.height/2){before=tags[i];break}}
  side.insertBefore(DR.tag,before||side.querySelector(".tag.new"));
}
window.addEventListener("pointermove",function(e){
  if(!DR)return;
  if(!DR.on){
    var mv=Math.hypot(e.clientX-DR.x,e.clientY-DR.y);
    if(DR.touch){if(mv>8){clearTimeout(DR.timer);DR=null}} else if(mv>5)startDrag();
    return;
  }
  moveDrag(e.clientY);
});
side.addEventListener("touchmove",function(e){if(DR&&DR.on)e.preventDefault()},{passive:false});
side.addEventListener("contextmenu",function(e){if(DR)e.preventDefault()});
function endDrag(ok){
  if(!DR)return; clearTimeout(DR.timer);
  if(DR.on){
    DR.ghost.remove();
    if(ok){
      var ids=[].map.call(side.querySelectorAll(".tag[data-sel]"),function(t){return +t.dataset.sel});
      plants=ids.map(function(id){return plants.find(function(p){return p.id===id})}); save();
    }
    justDragged=Date.now(); render();
  }
  DR=null;
}
window.addEventListener("pointerup",function(){endDrag(true)});
window.addEventListener("pointercancel",function(){endDrag(true)});

main.addEventListener("touchend",function(e){

/* GitHub 雲端同步 */
var GK="plantcare.gh", MK="plantcare.meta", gh=null, meta={sha:"",at:0,dirty:false}, pushT=0, syncing=false;
try{gh=JSON.parse(localStorage.getItem(GK)||"null")}catch(e){}
try{meta=Object.assign(meta,JSON.parse(localStorage.getItem(MK)||"{}"))}catch(e){}
function saveMeta(){try{localStorage.setItem(MK,JSON.stringify(meta))}catch(e){}}
function setStatus(t){var b=document.getElementById("syncBtn");b.textContent="雲端同步・"+t;b.className="syncb"+(t==="已同步"?" ok":t==="待同步"?" bad":"")}
function b64e(x){return btoa(unescape(encodeURIComponent(x)))}
function b64d(x){return decodeURIComponent(escape(atob(x.replace(/\s/g,""))))}
function api(method,body,g){
  g=g||gh;
  return fetch("https://api.github.com/repos/"+encodeURIComponent(g.owner)+"/"+encodeURIComponent(g.repo)+"/contents/plant-data.json",
    {method:method,cache:"no-store",headers:{"Authorization":"Bearer "+g.token,"Accept":"application/vnd.github+json","X-GitHub-Api-Version":"2022-11-28"},body:body?JSON.stringify(body):undefined});
}
async function pull(){
  var r=await api("GET"); if(r.status===404)return {none:true};
  if(!r.ok)throw new Error("HTTP "+r.status);
  var j=await r.json(); return {sha:j.sha,data:JSON.parse(b64d(j.content))};
}
async function push(){
  setStatus("同步中");
  var at=meta.at||Date.now(), body={message:"update "+new Date().toISOString(),content:b64e(JSON.stringify({v:1,updatedAt:at,plants:plants}))};
  if(meta.sha)body.sha=meta.sha;
  var r=await api("PUT",body);
  if(r.status===409||r.status===422){var cur=await pull(); if(cur.none)delete body.sha; else body.sha=cur.sha; r=await api("PUT",body)}
  if(!r.ok)throw new Error("HTTP "+r.status);
  var j=await r.json(); meta.sha=j.content.sha; meta.dirty=false; saveMeta(); setStatus("已同步");
}
function applyRemote(rm){
  plants=rm.data.plants||[]; meta.sha=rm.sha; meta.at=rm.data.updatedAt||Date.now(); meta.dirty=false;
  try{localStorage.setItem(KEY,JSON.stringify(plants))}catch(e){}
  saveMeta(); render(); setStatus("已同步");
}
async function sync(){
  if(!gh||syncing)return; syncing=true; setStatus("同步中");
  try{
    var rm=await pull();
    if(rm.none){meta.sha="";if(!meta.at)meta.at=Date.now();await push()}
    else if(!meta.sha){
      if(confirm("雲端已有植物資料。\n\n按「確定」：使用雲端資料（取代這支裝置目前的資料）\n按「取消」：保留這支裝置的資料，並覆蓋雲端"))applyRemote(rm);
      else{meta.sha=rm.sha;meta.at=Date.now();await push()}
    }
    else if(rm.sha===meta.sha){if(meta.dirty)await push();else setStatus("已同步")}
    else if(meta.dirty&&meta.at>(rm.data.updatedAt||0)){meta.sha=rm.sha;await push()}
    else applyRemote(rm);
  }catch(e){setStatus("待同步")}
  syncing=false;
}
function schedulePush(){clearTimeout(pushT);setStatus("待同步");pushT=setTimeout(doPush,1500)}
async function doPush(){
  if(!gh)return; if(syncing){pushT=setTimeout(doPush,1000);return}
  syncing=true; try{await push()}catch(e){setStatus("待同步")} syncing=false;
}
document.getElementById("syncBtn").onclick=function(){
  document.getElementById("gOwner").value=gh?gh.owner:""; document.getElementById("gRepo").value=gh?gh.repo:"";
  document.getElementById("gTok").value=""; document.getElementById("gTok").placeholder=gh?"已設定（留空表示不變）":"貼上你產生的 token";
  document.getElementById("gErr").textContent=""; document.getElementById("gOff").hidden=!gh; document.getElementById("ds").showModal();
};
document.getElementById("gNo").onclick=function(){document.getElementById("ds").close()};
document.getElementById("gOff").onclick=function(){
  gh=null; try{localStorage.removeItem(GK)}catch(e){} meta.sha=""; meta.dirty=false; saveMeta(); clearTimeout(pushT); setStatus("未設定"); document.getElementById("ds").close();
};
document.getElementById("gOk").onclick=async function(){
  var err=document.getElementById("gErr"), owner=document.getElementById("gOwner").value.trim(), repo=document.getElementById("gRepo").value.trim(), tok=document.getElementById("gTok").value.trim()||(gh&&gh.token)||"";
  if(!owner||!repo||!tok){err.textContent="請填寫帳號、repo 名稱和 token。";return}
  err.textContent="檢查中…"; this.disabled=true;
  try{
    var r=await fetch("https://api.github.com/repos/"+encodeURIComponent(owner)+"/"+encodeURIComponent(repo),{headers:{"Authorization":"Bearer "+tok,"Accept":"application/vnd.github+json"}});
    if(r.status===401){err.textContent="Token 無效或已過期。"}
    else if(r.status===404){err.textContent="找不到這個 repo：請確認名稱，以及 token 有選取這個 repo。"}
    else if(!r.ok){err.textContent="連線失敗（"+r.status+"）。"}
    else{
      var j=await r.json();
      if(!j.private){err.textContent="這是公開 repo，資料會被所有人看到。請改用私人 repo。"}
      else if(j.permissions&&j.permissions.push===false){err.textContent="這個 token 沒有寫入權限：請把 Contents 設為 Read and write。"}
      else{
        var changed=!gh||gh.owner!==owner||gh.repo!==repo;
        gh={owner:owner,repo:repo,token:tok}; try{localStorage.setItem(GK,JSON.stringify(gh))}catch(e){}
        if(changed){meta.sha="";saveMeta()}
        document.getElementById("ds").close(); sync();
      }
    }
  }catch(e){err.textContent="無法連線到 GitHub，請檢查網路。"}
  this.disabled=false;
};
document.addEventListener("visibilitychange",function(){if(!document.hidden&&gh){if(meta.dirty)doPush();else sync()}});
window.addEventListener("online",function(){if(gh)meta.dirty?doPush():sync()});

(function(){
  var vv=window.visualViewport;
  function set(){root.style.setProperty("--vh",(vv?vv.height:window.innerHeight)+"px");window.scrollTo(0,0)}
  set(); if(vv){vv.addEventListener("resize",set)} window.addEventListener("orientationchange",set);
})();
load(); render();
setStatus(gh?(meta.dirty?"待同步":"同步中"):"未設定"); if(gh)sync();
setInterval(render,60000);
})();
</script>
